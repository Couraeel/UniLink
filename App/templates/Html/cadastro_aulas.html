
<form method="POST">
    {% csrf_token %}
    <div>
        <label>Matéria</label>
        <input type="text" name="materia" required>
    </div>
    
    <div class="mb-3">
        <label>Conteúdo</label>
        <textarea name="conteudo" rows="3" required></textarea>
    </div>

    <div class="mb-3">
        <label>Data</label>
        <input type="date" name="data" required>
    </div>

    <div class="mb-3">
        <label>Horário</label>
        <input type="time" name="horario" required>
    </div>

    <div class="mb-3">
        <label>Vagas</label>
        <input type="number" name="vagas" required>
    </div>

    <button type="submit" >Salvar Aula</button>
</form>

<a href = "{% url 'home' %}">
            <button>Home</button>
