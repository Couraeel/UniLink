{% extends 'base.html' %}

{% block title %}Agendar Aula{% endblock %}

{% block content %}
<h2 class="titulo-pagina">Gerenciamento de Aulas</h2>

<div class="painel" style="max-width: 700px; margin: 0 auto;">
    <div class="titulo-painel">Agendar Nova Aula</div>

    <form method="POST">
        {% csrf_token %}
        
        <div class="bloco-input">
            <label for="materia">Matéria</label>
            <input type="text" id="materia" name="materia" required placeholder="Ex: Matemática">
        </div>
        
        <div class="bloco-input">
            <label for="conteudo">Conteúdo a ser lecionado</label>
            <textarea id="conteudo" name="conteudo" rows="1" required placeholder="Ex: Plano Cartesiano"></textarea>
        </div>

        <div class="linha-dupla">
            <div class="bloco-input">
                <label for="data">Data para a aula</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="bloco-input">
                <label for="horario">Horário para a aula</label>
                <input type="time" id="horario" name="horario" required>
            </div>
        </div>

        <div class="bloco-input">
            <label for="vagas">Vagas disponíveis</label>
            <input type="number" id="vagas" name="vagas" min="1" required placeholder="Ex: 20">
        </div>

        <div style="display: flex; gap: 12px; margin-top: 25px;">
            <button type="submit" class="botao" style="flex: 2; padding: 12px;">Salvar Aula</button>
        </div>
    </form>
</div>
{% endblock %}
